# OpenMontage - Global Configuration

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: null                    # null = use provider default
  temperature: 0.7
  max_tokens: 4096

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output

# The 2.5D depth plates.
#
# cap: how many stills in one film may carry one. The work is per-still and
# the Friday run has a wall-clock, so it is a budget rather than a limit on
# quality. Measured 2026-11-09: a depth map is 0.58s once the model is
# resident, a DepthFlow clip about 0.9s per second of cut, and an anchor
# track 22.9s — so 25 stills costs between 3 and 12 minutes depending on how
# many of them are annotated stills, against a one-hour ceiling.
depth:
  cap: 25
