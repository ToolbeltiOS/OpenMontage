identity:
  name: "Wak3up Documentary"
  category: cinematic
  mood: grave, patient, archival, unsentimental
  pace: deliberate
  best_for: "Long-form narrated documentary (19-21 min) built from public-archive footage, for the Wak3upSociety YouTube channel"

taste_profile:
  design_read: "Dark investigative documentary in the channel's mystery register: a researcher's desk at night, taking the unexplained seriously. Gravity, not camp. Authority from evidence and attribution, not from scale."
  visual_variance: 6
  motion_intensity: 3
  information_density: 4
  palette_discipline: "Near-black field, warm bone text, single ochre accent drawn from weathered stone. No teal-and-orange grade, no neon, no cyan 'tech' glow."
  layout_variation: "Alternate full-bleed archive footage, map/timeline frames, document-reveal push-ins, and lower-third attribution moments."
  reference_strategy: "Build one reference frame per scene family (footage, map, timeline, document, lower-third) before the act is assembled."
  # NOTE: these are VISUAL anti-patterns only. They constrain how mystery and
  # conspiracy material is *rendered*, never whether it may be covered. This
  # playbook places no content-level restriction on subject matter — see
  # `content_stance` below.
  anti_patterns:
    - "ancient-aliens visual kitsch: UFO art, red arrows, question-mark graphics, pulsing zooms"
    - "teal-and-orange blockbuster grade"
    - "static held stills with no camera move"
    - "stock-footage sheen: clean modern 4K drone plates standing in for archive material"
    - "a cut whose only justification is that the clip was available"
  quality_gates:
    - "Every frame should look sourced, not generated."
    - "If a claim is on screen, its support is in the research brief."
    - "A viewer scrubbing any 30 seconds should see at least four distinct images."

# ── Content stance ──────────────────────────────────────────────────
# The channel's identity is mystery and conspiracy. This playbook imposes NO
# content-level deprioritization of those subjects. What it governs is how a
# contested claim is *handled*, not whether it may be told.
content_stance:
  niche: "mystery, conspiracy, the unexplained — the channel's established identity"
  topic_deprioritization: none
  spine: mystery_first
  register: "the channel's mystery voice — serious, curious, unsentimental"
  forbidden_registers:
    - "sneering"
    - "debunking register"
    - "smug corrective tone"
    - "credulous hype that asserts a contested claim as settled"
  alternative_claims:
    present_seriously: true
    require_strongest_proponent: true    # name the best advocate, not a straw man
    require_best_evidence: true          # their strongest evidence, not their weakest
    attribution_required: true           # "proponents argue", "Hancock's thesis is"
  method_layer:
    role: investigation_not_thesis
    rule: "Experimental archaeology is the instrument used to test each claim on camera, never the moral of the story."
    when_case_closes: "say so plainly, without triumph"
    when_case_stays_open: "that is the act's climax — the genuinely open cases are the payoff"
  contested_handling: "Narrated as contested in BOTH directions: neither the orthodox nor the alternative account is asserted as settled when the ledger says it is disputed."

# ── Structure ───────────────────────────────────────────────────────
# Encodes the commissioned shape. The script director reads this as a
# contract, not a suggestion.
structure:
  target_duration_seconds: 1200
  duration_band_seconds: [1140, 1260]        # 19-21 minutes, hard
  # LOWERED 2026-10-20 from [2800, 3200]. Run #1 filled 20 minutes with 99.4%
  # narration and thirteen seconds of silence in the whole film. Air is now
  # planned in the script and synthesised as real gaps, which costs words: at
  # 150 wpm, 8-15% air over 1200s is 96-180s that are not speech.
  narrated_word_band: [2500, 2700]
  words_per_minute_target: 150
  # The film's duration is speech plus planned air, not words / wpm. Measuring
  # it the old way counted the air as overrun and would send the script back
  # for being too long when it was exactly right.
  duration_measurement: speech_plus_planned_air

  # ── air ────────────────────────────────────────────────────────────────
  # AIR IS WRITTEN, NOT FOUND (owner, 2026-10-20). A gap that nobody wrote
  # does not appear: run #1's pause_policy asked for "a full beat of silence
  # after each verdict sentence" and the delivered film's longest silence was
  # 2.8 seconds, because nothing in the chain turned the policy into a number.
  # The script marks air; the narration stage synthesises it; the mix measures
  # what it realised against what was planned.
  air:
    written_not_found: true
    marker: "[air N.Ns]"              # between paragraphs, in the section text
    allowed_lengths_seconds: [1.5, 2.5, 4.0]
    film_total_pct: [8, 15]           # of the finished runtime
    rules:
      - "After a landing line: 1.5s or 2.5s. The picture holds; no cut lands
         inside the silence."
      - "At each act's own climax: 4s, once per act."
      - "Before a reveal, where the narration has set it up and the picture has
         not yet turned: 1.5s."
      - "At least one gap of 1.5s or longer every two minutes."
      - "Air is never used to reach the duration band. A film that needs air to
         make length is short, and the fix is more film, not more silence."
    measured_run_1:
      air_seconds_total: 13.0
      narration_coverage_pct: 99.4
      longest_gap_seconds: 2.8
      note: >
        Measured from render_props captions. The references run 63-97% coverage
        with gaps up to 115s; see reports/reference_pacing.md section 3.

  act_count_band: [4, 5]
  cold_open:
    # Raised from 45 to 46 on 2026-10-18. The approved cold open measures
    # 45.99s at speed 0.89, and 0.89 is the speed the delivery was approved at;
    # dropping to 0.98 to save 1.3s changes the read. The ceiling moved rather
    # than the performance.
    max_seconds: 46
    must_carry_hook_from: "best_performing_source_short"
    hook_reuse_mode: "language_and_rhythm"   # re-voice the hook; do NOT lift 9:16 source frames into a 16:9 canvas
    rules:
      - "Opens on the most arresting concrete image or claim available."
      - "Plants the central question and does not answer it."
      - "No greeting, no channel intro, no 'in this video'."
  # Added 2026-10-20. Run #1 went from the cold open straight into act 1, so
  # the film never announced itself and the title existed only in the YouTube
  # listing. Default ON: a film that opts out says so here.
  title_sequence:
    enabled: true
    placement: immediately_after_cold_open
    seconds_band: [6, 8]
    scene_type: title_sequence          # see component-contract.json
    rules:
      - "The film's title in Display over a treated hero still, plus the channel mark."
      - "One accent event only — the rule reaching full width — and it lands on
         the sting. The audio stage places the sting on the component's
         sting_at, so the hit and the move are one event, not two."
      - "No persistent chrome. The frame returns on the first scene after it,
         and its absence here is what makes the film read as having begun."
      - "Not an act card: the act card is a chapter break inside a film that is
         already running, holds shorter, and sets type a level down."

  # Mystery-first act shape. Every act opens on the unexplained, not on the
  # explanation. Method enters as the instrument of investigation.
  act_shape:
    spine: mystery_first
    beat_order:
      - "LEAD WITH THE UNEXPLAINED — the anomaly, stated at full strength."
      - "THE ALTERNATIVE CLAIM — its strongest proponent and their best evidence, attributed."
      - "THE TEST — what experimental archaeology actually did to probe it."
      - "THE VERDICT OR THE GAP — closed, say so plainly; still open, that is the act's climax."
    rules:
      - "Never open an act on the orthodox explanation; open on the thing that needs explaining."
      - "The alternative claim gets its strongest form, named proponent and best evidence — never a straw man."
      - "An act whose case closes must still end on what the closure does NOT explain."
      - "The final act is built entirely from cases that remain genuinely open."
  ending:
    mode: open_question
    rules:
      - "Do not recap the acts; the viewer just watched them."
      - "Land on the implication the piece earned, and stop."
      - "The closing question is a real one — a case the ledger shows is still open, not rhetorical suspense."
  outro_cta:
    treatment: "voiced CTA <= 10 s with an animated like/subscribe"
    max_seconds: 10
    nothing_essential_in_last_seconds: 20
    scene_type: outro_cta          # see component-contract.json
    rules:
      - "Two sentences. The first is a landing line at 0.76; the ask runs at the body speed."
      - "The ask is earned, not demanded: tie it to what the viewer just spent."
      - "The animation is timed to the words. Take the word timings from the
         synthesiser (kokoro create_timed), not from an aligner run afterwards,
         so the press lands on the syllable."
      - "Icons are drawn in the design system's line style. No platform marks
         and no platform colours — the activation colour is the film's ochre."
      - "Leave the right third and the bottom fifth of the frame clear: that is
         where YouTube places End Screen elements, and anything there is covered."
    measured_run_2:
      duration_seconds: 11.1
      note: >
        Over the 10 s target. The approved copy at the approved speeds is 10.79 s
        of speech before any pause between the sentences: sentence 1 at 0.76 is
        4.16 s, sentence 2 at 0.87 is 6.63 s. Hitting 10 s needs either shorter
        copy or sentence 2 at about 1.05, which is faster than the body rate and
        reads rushed exactly where the ask lands. Recorded rather than fudged.

# ── Script production rules ─────────────────────────────────────────
script_rules:
  # ── beat tagging (ADDED 2026-10-20) ──────────────────────────────────
  # Every paragraph carries a beat type, and the planner reads it to set the
  # shot band. Without it the planner has nothing to vary on and falls back to
  # one band for the whole film, which is how run #1 came out metronomic.
  beat_tagging:
    required: true
    granularity: paragraph
    types: [reveal, exposition, landing, transition]
    marker: "[beat: <type>]"          # first line of the paragraph
    default: exposition
    rules:
      - "A reveal is the paragraph that turns the act — one per act at most,
         and the act has to have earned it."
      - "A landing is the sentence after a reveal, where the voice stops. It is
         followed by written air."
      - "A transition moves between subjects or acts and is the only beat that
         may run as a burst."
      - "Everything else is exposition. Tagging everything a reveal is the same
         as tagging nothing."
  air_markers:
    required: true
    marker: "[air N.Ns]"              # on its own line between paragraphs
    see: structure.air
  generation_mode: outline_first_then_act_by_act
  never_generate_whole_script_in_one_call: true
  act_pass_context: ["outline", "previous_act_text", "assigned_claim_ids"]
  citation_binding:
    source_artifact: research_brief
    ledger_required: true
    forbidden_without_ledger_entry: ["date", "name", "figure", "quote"]
    rule: "The script may not state a date, name or figure that is absent from the research_brief claim ledger. Send it back for a source, or cut the sentence."
    contested_claims_must_be_narrated_as_contested: true
    # Attribution is what lets an alternative claim be presented at full
    # strength without the narration asserting it.
    attribution_required_for_alternative_claims: true
    attribution_forms:
      - "proponents argue"
      - "<name>'s thesis is"
      - "<name> has proposed"
      - "the claim rests on"
    rule_attribution: "An alternative claim is voiced in full, attributed to a named proponent, and sourced. Attribution is never a hedge against sourcing — an attributed claim still needs a ledger entry."
    both_directions: "When the ledger marks a question disputed, neither the orthodox nor the alternative account may be narrated as settled."
  research_requirements:
    encyclopedia_pull_for_every_named_entity: true
    encyclopedia_sources: ["wikipedia", "wikimedia_commons"]
    min_ledger_entries: 8
    min_sources: 8
    two_sources_required_for: ["surprising_figure", "hook_claim"]
  padding_check_per_act:
    - "New information: does this act tell the viewer something no earlier act told them? Name it in one sentence."
    - "No restatement: does any paragraph re-explain something already established? Cut it."
    - "Earned length: if this act were 20% shorter, what would be lost? If nothing, it is 20% too long."
    - "Ledger density: at least one ledger entry spent per ~150 words."
  reject_on:
    - "an act that restates an earlier act"
    - "a factual span with no claim_ref"
    - "word count more than 10% outside the band"

# ── Rhythm ──────────────────────────────────────────────────────────
# ADDED 2026-10-20 from reports/reference_pacing.md. The playbook already said
# "cut on meaning, never on a fixed interval" and the film came out metronomic
# anyway: 181 of run #1's 182 shots were 5-8 seconds long, p10 5.89s and p90
# 7.47s, with 8-10 cuts in every single minute. Nothing implemented the rule,
# because the planner had one hold band and applied it to every slot.
#
# A beat type now sets the band. The targets below are measured, not invented —
# eight hand-counted minutes across LEMMiNO, Barely Sociable and Fall of
# Civilizations, every one of which swings by a factor of three to seven inside
# a single film.
rhythm:
  source: reports/reference_pacing.md
  beat_types: [reveal, exposition, landing, transition]
  default_beat: exposition
  targets:
    reveal:
      shot_seconds: [12, 25]
      cuts_per_minute: [2, 4]
      shots_per_beat: 1
      # A twelve-second hold on a static still is a slideshow; on the
      # references it is always a shot with motion inside it — an orbit, a
      # scrolling document, an animated diagram. The long hold is earned by
      # internal movement, not granted by the beat type.
      long_hold_requires: internal_motion
      internal_motion_treatments:
        - authored_graphic_with_timed_reveals
        - real_footage
        - parallax_2_5d_across_an_oversized_frame
        - slow_push_in_over_4pct_total
    exposition:
      shot_seconds: [6, 10]
      cuts_per_minute: [6, 9]
    landing:
      shot_seconds: [4, 8]
      cuts_per_minute: [0, 2]
      no_cut_during_air: true        # the picture holds through the silence
    transition:
      shot_seconds: [1.5, 3.5]
      cuts_per_minute: [15, 25]
      burst_seconds: [8, 15]         # how long a burst may run before it ends
  # Checked across the finished film, not per slot. A film that hits every
  # per-beat band and still reads flat will fail the spread test.
  film_envelope:
    cuts_per_minute_mean: [6, 10]
    cuts_per_minute_spread_min: 4    # busiest minute minus quietest minute
    shot_length_p90_min_seconds: 12  # the long tail has to exist
    shot_length_p10_max_seconds: 4   # and so does the short one
    max_pct_of_shots_in_any_2s_band: 45
  measured_run_1:
    shots: 182
    cuts_per_minute_mean: 9.04
    cuts_per_minute_range: [8, 10]
    shot_length_p10: 5.89
    shot_length_p90: 7.47
    pct_of_shots_in_5_to_8s: 99.5

# ── Visual cadence ──────────────────────────────────────────────────
visual_cadence:
  # SUPERSEDED for shot length by `rhythm.targets` above: this band is the
  # exposition band, and it is what a slot gets when no beat type reaches it.
  # Left in place because the scene plan and several checks still read it.
  cut_interval_seconds: [5, 8]
  cut_interval_is_beat_aware: true
  cut_on: meaning_change            # never on a metronome
  # AMENDED 2026-10-18 by owner decision, after measured source health showed the
  # keyless archives hold stills rather than footage for megalithic subjects.
  # Original targets were footage 55-75 / graphics 15-30 / stills 0-20; they were
  # not reachable from tier 1 and would have forced generic stock to set the look.
  # RUN #1: mix bands are RECORDED, NOT GATED (owner decision 2026-10-18).
  # Targets are not amended a fourth time; the final measured mix is reported
  # in the asset manifest and the render report instead.
  mix_targets_gated: false
  mix_targets_note: "advisory only for run #1 — do not fail a gate on these"
  mix_targets:
    real_footage_pct: [15, 25]
    motion_graphic_pct: [30, 40]
    still_image_pct: [40, 45]
  # Provenance of all three amendments, newest last.
  mix_targets_superseded:
    - revision: r1
      note: "Original commission, pre-measurement"
      real_footage_pct: [55, 75]
      motion_graphic_pct: [15, 30]
      still_image_pct: [0, 20]
      superseded_because: "Keyless archives hold stills, not footage, for megalithic subjects."
    - revision: r2
      note: "After measured source health (2026-10-18)"
      real_footage_pct: [30, 40]
      motion_graphic_pct: [25, 35]
      still_image_pct: [35, 40]
      superseded_because: "The 30-40% footage floor could only be met by Pixabay texture, and visual review rejected 12 of 41 texture clips as unusable (gym, money, tractor, espresso machine). mixkit and dareful returned zero results for every query."

  stills:
    min_pct: 40
    max_pct: 45
    treatment_required: true
    treatment_mandatory: true        # parallax/2.5D is not optional at this share
    allowed_treatments: ["parallax_2_5d", "slow_push_in", "drift_across_oversized_frame"]
    # Beat-aware since 2026-10-20. 6s remains the cap for every beat except a
    # reveal, and a reveal may only exceed it with real motion inside the shot
    # (rhythm.targets.reveal.long_hold_requires). A still that merely sits
    # there for twelve seconds is the slideshow this cap was written against.
    max_hold_seconds: 6
    max_hold_seconds_by_beat:
      reveal: 25                     # requires internal_motion
      exposition: 6
      landing: 8
      transition: 3.5
    no_consecutive_same_source: true # two stills in a row may not come from the same provider
    max_consecutive_stills: 2        # a motion slot must break any run of two
    rule: "At 40-45% of slots, stills carry nearly half the film. Every one takes a parallax or 2.5D move, none is held past 6 seconds, and no two in a row come from the same source. A static hold at this share reads as a slideshow immediately."
  # ── cinematic maps (ADDED 2026-10-20) ─────────────────────────────────
  # Run #1's maps were a dark silhouette on a flat plate: nothing on screen
  # said that the Altar Stone's route crosses a sea, or that Preseli is a
  # range of hills. The route was the only thing drawn and the geography it
  # crossed was a shape.
  maps:
    base: terrain
    source:
      name: "Natural Earth II with Shaded Relief and Water, 1:10m"
      licence: public domain
      url: "https://www.naturalearthdata.com/downloads/10m-raster-data/10m-natural-earth-2/"
      local: assets/basemaps/NE2_HR_LC_SR/      # 700MB, gitignored, re-downloadable
      tiles_built_by: scripts/build_basemap_tile.py
    treatment:
      ocean: "flooded with the palette, masked by the coastline the map already
              draws — the tint lands on the coast instead of being colour-keyed
              out of the raster"
      land: "relief kept; desaturated and lifted into the film's grade"
      coastline: "a hairline over the raster, so the route has an edge to read
                  against"
      drift_pct: [1, 2]
    rules:
      - "A terrain base always takes the 50m coastline, whatever the scale
         rule says. 110m against a 1:10m raster leaves relief showing through
         the sea and the sea lying over Norway."
      - "Tiles are cut at build time in the source's own projection and warped
         per row into the shot's Mercator. Reprojecting 700MB per frame to
         avoid a 300KB JPEG is the wrong trade in every direction."
    globe_descent:
      seconds: [3, 4]
      hands_off_to: the same map, at the same extent
      rule: "The camera moves onto the ray through the target and looks back
             at the centre. Rotating the globe instead means deriving the
             texture's orientation from the sphere's winding, and the first
             attempt put Antarctica in frame on a descent to Scotland."
      requires: "WebGL — --gl=angle on this machine"

  motion_graphic_types:
    - map                           # route tracing, site location
    - cross_section_diagram         # joint geometry, drill cores, block section
    - timeline                      # placing an event against a span
    - document_reveal               # push-in on a scan or record ('declassified file' reveal)
    - lower_third                   # name, place, date — first mention only
  hero_slots:
    min_total: 2
    min_per_act: 1
    hold_may_exceed_ceiling: true
  cadence_exceptions:
    reveal_hold: "On the single biggest claim, hold one strong image past the ceiling and let the narration land."
    burst: "Through a dense list, run 2-3s cuts for 10-15s, then return to cadence."
  adjacency_rule: "No two adjacent cuts share BOTH subject and scale."
  # Retuned for the amended mix. The test must still read LOW at 35-40% stills,
  # so it no longer keys off the stills SHARE — it keys off the things that
  # actually make a high still-share look like a slideshow: dead holds, runs,
  # repeated sources and absent motion.
  slideshow_risk:
    must_be: low
    basis: "STRUCTURAL ONLY for run #1 — share-based conditions removed by owner decision; runs, dead holds, repeated sources and window density still bind."
    high_if_any:
      - "any still lacks a parallax/2.5D or push-in treatment"
      - "any still is held longer than 6 seconds"
      - "three or more consecutive slots are stills"
      - "two consecutive stills come from the same source"
      - "mean hold exceeds the 8s cadence ceiling"
      - "more than a third of slots lack a confirmed source family"
      - "any 30-second window contains fewer than four distinct images"
      - "two consecutive slots are both authored texture graphics"

# ── Source acquisition ──────────────────────────────────────────────
sources:
  keyless_first: true
  # Strict tier order. Exhaust a tier before falling through to the next.
  # PEXELS IS DELIBERATELY ABSENT: new key issuance has been paused by Pexels
  # since 2026-09-30, so PEXELS_API_KEY stays unset and the adapter is excluded
  # outright rather than left to fail a retrieval mid-run.
  source_order:
    - tier: 1
      name: keyless_archives
      sources: [archive_org, nasa, esa, wikimedia, loc, nara]
    - tier: 2
      name: pixabay_video
      sources: [pixabay_video]
  excluded:
    pexels: "key issuance paused by Pexels since 2026-09-30; PEXELS_API_KEY intentionally unset"
    videvo: "requires VIDEVO_API_KEY; not provisioned"
    mixkit: "REMOVED 2026-10-18 — returned ZERO results for every query across 82 attempts despite reporting available"
    dareful: "REMOVED 2026-10-18 — returned ZERO results for every query across 82 attempts despite reporting available"
    unsplash: "REMOVED 2026-10-18 — returns semantically unrelated stock for non-elemental queries, exactly as Pixabay does. A refill pass produced a municipal coat of arms, construction workers, a green-screen studio shot and a blank white frame. No generic-stock stills remain in this project."
  subject_routing:
    space: [nasa, esa]
    mid_century_institutional: [archive_org, nara]
    documents_and_artefacts: [wikimedia, loc]
    elemental_texture: [pixabay_video]
    stills_of_record: [wikimedia, loc]
  # What each source is ALLOWED to do, not merely whether it responds.
  source_roles:
    site_illustration:
      description: "The primary visual of a NAMED site, structure or artefact"
      permitted: [wikimedia, loc, nara, archive_org]
      forbidden: [pixabay_video]
      rule: "A named site is never illustrated by generic stock. If no archive asset exists for that site, the slot becomes a cross-section diagram or a sourced still — not a lookalike clip."
    texture:
      description: "ELEMENTAL MOOD BEDS ONLY — dunes, sea, storm cloud, rock face, fog, dust, sand, night sky, waves, dry riverbed. Not illustrations of anything."
      doctrine: "AMENDED 2026-10-18. Abstract and literal queries both failed: 'rope under tension' returned a gym, 'abrasive slurry' a tractor, and a literal re-query of 'rope close up' returned a spider web. Pixabay matches loosely over a modern commercial library, so texture is now sourced from ~10 elemental terms and treated as mood, never as depiction."
      authored_alternative: "Remaining texture is AUTHORED in Remotion — particle dust, film grain, slow light sweep across a Wikimedia stone still. Authored texture counts as a GRAPHIC, not as footage." 
      permitted: [pixabay_video, wikimedia]   # pixabay ELEMENTAL TEXTURE ONLY
      rule: "Pixabay is permitted HERE ONLY. Texture carries motion between archive assets; it must never set the look and must never stand in for a named site."
    stills_of_record:
      description: "Photographs, scans and document plates under a parallax or push-in move"
      permitted: [wikimedia, loc]

  # Measured 2026-10-18 against the live adapters and APIs. Re-verify per
  # production; these are adapter/holdings facts, not permanent properties.
  known_source_health:
    wikimedia_stills: "HEALTHY and effectively unlimited. Measured bitmap holdings: Giza 9,455 / Stonehenge 3,700 / Easter Island 1,254 / Sacsayhuaman 1,057 / Pumapunku only 86. This is the backbone of the amended mix."
    wikimedia_video: "THIN but contains genuine gems. Measured video holdings: Giza 19, Stonehenge 10, Sacsayhuaman 5, Easter Island 3, Pumapunku ZERO. Usable finds include 'Les Pyramides, 1897', 'Stonehenge.ogv', 'Sacsayhuaman Cuzco (2011)', 'Giza pyramid complex 3D flyover'. Several nominal hits are false matches on the word 'Giza' as a surname — verify every pick visually."
    archive_org: "NOT VIABLE FOR THIS SUBJECT. Retried 2026-10-18 with collection-scoped queries as instructed. Prelinger-only yields are tiny and almost entirely irrelevant: Stonehenge 3, Easter Island 2, Egypt quarry/pyramid 2, archaeology 26, Peru/Inca 17, masonry 23 — and the titles are 20th-century American industrial and home-movie material ('Social Security Story', 'Oxydol Goes Into High', 'General Motors Around the World', World's Fair home movies). The collection is ephemeral US film; it has essentially no megalithic holdings. Only two items merit a manual look: '[Burton Holmes Travelogue]' and a 1964 'Easter Island' item."
    archive_org_adapter_limitation: "The adapter hard-codes collections ('prelinger', 'opensource_movies', 'home_movies'); the source comment calls the override 'a future refinement'. Because opensource_movies is always OR-ed in, open queries return reupload spam (a Tadeo Jones trailer, 'luxury wine coolers'). Scoping to Prelinger alone is not reachable through the public adapter API."
    pixabay_video: "HEALTHY, highest volume (60 hits across 3 queries). Restricted to the texture role by owner decision."
    dareful: "Responds but relevance is weak for specific historical subjects; texture role only."
    loc: "DOWN — HTTP 403 on search. Marked down by owner decision; DO NOT RETRY THIS RUN."
    nara: "DOWN — search returns non-JSON. Marked down by owner decision; DO NOT RETRY THIS RUN."
    nasa_esa: "Responds but returns nothing for non-space subjects. Expected and correct; irrelevant to this topic."
  do_not_retry_this_run: [loc, nara]
  licence_required_on_every_asset: true
  rule: "Keyed and scraped stock fills gaps; it never sets the look. One unrelated clip is what makes a viewer stop trusting the piece."

visual_language:
  color_palette:
    primary: ["#0C0C0E", "#1A1A1F"]
    accent: ["#C08A3E", "#8A6A3B"]
    background: "#0C0C0E"
    text: "#EDE6D8"
    muted: "#8A8578"
  composition: "full-bleed archive frame with a lower-left attribution zone; map and timeline frames centred with generous margins; one claim per frame"
  texture: "fine film grain over graded footage, paper-grain field behind document reveals, no gloss and no vignette beyond a slight natural falloff"

  # ── film look (CHANGED 2026-10-20, owner decision) ────────────────────
  # The shader pass is the DEFAULT path. The +25% render budget was withdrawn
  # after it was measured: the floor of the approach is +79% a frame and the
  # full stack is +100%, about fifteen extra minutes on a twenty-minute film,
  # because the cost is having a WebGL canvas at all rather than the effects
  # in it (reports/film_look_cost.md).
  #
  # Both paths run the SAME grade operations in the same order — multiply,
  # saturate, contrast — so what differs between them is the look and not the
  # exposure. Matched to within 2% of mean luminance on three plates.
  film_look:
    path: shader
    stack: full            # grade + halation + lens aberration + vignette + grain
    fallback: css          # a flag, not a mode: set film_look.path to css
    pass: second           # over finished frames; a composition is DOM and WebGL cannot sample DOM
    requires: "--gl=angle on this machine"
    measured_ms_per_frame: {css: 24.4, shader_full: 48.9}
    what_it_buys:
      - "Halation: the highlights bloom and the stone does not. No CSS layer
         can do this, because no layer knows which pixels are bright."
      - "A vignette that falls off with distance instead of a dark ring."
      - "Grain that belongs to the image rather than a fixed tile on top."
    rule: "A caption, a title or any authored graphic is composited BEFORE the
           pass, so the grain and the vignette sit over the whole frame rather
           than under the furniture."

  # ── per-act grade (ADDED 2026-10-20) ──────────────────────────────────
  # The uniform grade stays: it is what stops a cut between an 1890s plate and
  # a modern photograph announcing its source. What it could not do is give an
  # act a temperature of its own, so run #1's four acts looked identical even
  # though they are set on a Greek ridge, a Pacific island, an Egyptian quarry
  # and four unresolved sites.
  #
  # These are OFFSETS on the base grade, not replacements. They apply to
  # photographic material only — stills, footage, treated plates. Authored
  # graphics keep the base palette and get it structurally, because a
  # schematic or a timeline is never wrapped in the grade wrapper: an ochre
  # rule that shifts warm in act 3 reads as a rendering fault.
  #
  # temperature is the opacity of a warm wash; negative is the cool one.
  grade_by_act:
    cold_open: {temperature: -0.05, saturation: 0.80, lift: 0.07}   # the Pacific, open and cold
    act1:      {temperature:  0.02, saturation: 0.88, lift: 0.05}   # Tiryns, nearest the base look
    act2:      {temperature: -0.04, saturation: 0.82, lift: 0.06}   # the quarry and the sea route
    act3:      {temperature:  0.08, saturation: 0.90, lift: 0.04}   # Aswan granite, the warmest act
    act4:      {temperature: -0.02, saturation: 0.78, lift: 0.09}   # the open cases; the film drops here
    outro:     {temperature:  0.03, saturation: 0.86, lift: 0.05}
  grade_rules:
    - "Offsets only. The band is narrow on purpose — a viewer should not be
       able to name the change, only notice that act 3 is hotter."
    - "Photographic material only. Authored graphics keep the base palette."
    - "One wash per act, warm or cool, never both."
    - "The table lives in remotion-composer/src/design/system.ts as
       GRADE_BY_ACT; this block is the statement of intent, that is the
       implementation, and a test pins them together."

typography:
  headings:
    font: "Source Serif 4"
    weight: 600
    tracking: "-0.005em"
  body:
    font: "Inter"
    weight: 400
    line_height: 1.5
  code:
    font: "JetBrains Mono"
    weight: 400
  stat_card:
    font: "Source Serif 4"
    weight: 700
    size_multiplier: 2.8
  scale_system: "major_third"
  weight_matrix:
    title: 700
    heading: 600
    body: 400
    caption: 500

# ── Edit rules ──────────────────────────────────────────────────────
edit_rules:
  transition_vocabulary:
    default: straight_cut
    rules:
      - "Straight cut on meaning change. This is the default and the majority."
      - "Cross-dissolve of 12-20 frames BETWEEN CONSECUTIVE STILLS WITHIN A BEAT only — never between a still and footage, never across a beat boundary."
      - "Fade through black BETWEEN ACTS, timed to the music crossfade at the act boundary."
      - "One optional grain / light-leak transition, RESERVED FOR HERO-SLOT ENTRIES. At most one per act, never two in succession."
    forbidden: [slide, wipe, flip, push, zoom_transition, star_wipe]
    forbidden_rule: "No slide, wipe or flip anywhere in the piece, under any circumstance."
  cross_dissolve_frames: [12, 20]
  act_boundary: fade_through_black
  act_boundary_sync: "fade length matches the music crossfade (2.5s) at that boundary"
  hero_entry_transition: grain_light_leak
  hero_entry_budget: "optional; max one per act"
  distinct_transition_types_max: 4

motion:
  transitions: [cut, dissolve, fade-to-black]   # at most 4 distinct types across the piece
  animation_style: "slow ease-out, archival restraint; push-ins under 4% scale per second; no bounce, no whip"
  max_push_pct_per_second: 4.0

  # ── camera intent (ADDED 2026-10-20) ──────────────────────────────────
  # Run #1 gave every still the same push. The treatment list below has three
  # entries and one of them carried 182 shots, so the film's only camera idea
  # was "in", at one speed, for twenty minutes. The move now comes from the
  # beat, and the reason is recorded on the cut.
  camera_intent:
    by_beat:
      reveal: push        # the frame closes on what is being revealed
      exposition: pull    # context arrives as the frame opens
      landing: lock       # the picture stops with the voice; the air is held
      transition: drift   # lateral movement carries the eye to the next subject
    speed_pct_per_second:
      push: 2.4
      pull: 2.0
      drift: 1.2
      lock: 0
    rules:
      - "A run of consecutive stills keeps ONE direction. Two drifts that go
         opposite ways throw the eye back where it came from and read as a
         mistake."
      - "One speed ramp per act, and only into a hard cut. It is the single
         place a move changes speed inside a shot; a second one is a trailer."
      - "A lock carries no parallax at all rather than a move of zero, so the
         renderer does no work on a shot that does not move."
      - "Every move records its reason on the cut. A move with no reason is
         the default by another name."
    # NOTE: the earlier "no speed ramps" clause in animation_style was dropped
    # on 2026-10-20 in favour of exactly one per act, into a hard cut. The
    # ramp is the only acceleration in the piece and it is budgeted.
  pacing_rules:
    # Film-wide floor and ceiling. The per-beat bands in `rhythm.targets` sit
    # inside them and are what the planner actually reads; these two are the
    # outer limits nothing may cross.
    min_scene_hold_seconds: 1.5
    max_scene_hold_seconds: 25
    min_scene_hold_seconds_default: 5
    max_scene_hold_seconds_default: 8
    text_card_hold_seconds: 4
    stat_card_hold_seconds: 4
    transition_duration_seconds: 0.5
  entrance: "fade from black with a 1.5% scale settle"
  exit: "soft fade; hard cut is the default between footage slots"

audio:
  voice_style: "measured, grave, unhurried; slower on the reveal and a beat of silence after it; no hype, no upspeak"
  sfx_style: "sparse — paper handling, distant room tone, a single low hit on an act boundary at most"

  # ── sound design (ADDED 2026-10-20) ───────────────────────────────────
  # A layer under the music, not beside it. Every level here is stated as an
  # offset from the music bed's own level, so moving the bed moves the floor
  # with it and the balance survives the A/B the owner will judge by ear.
  #
  # Why it exists: the references' beds sit 4-15 dB under the voice against
  # our 20, and part of what fills that distance is not music. It is wind,
  # room tone and the occasional hit. A bed raised on its own to close the gap
  # would be a louder tune; a floor built under it is the thing being copied.
  sound_design:
    enabled: true
    layer_order: [narration, music_bed, sound_design]
    ducking: same_envelope_as_music      # the explicit gain envelope, not a second compressor
    levels_relative_to_music_bed_db:
      ambience: -6                       # the per-act bed: wind, stone, sea, desert
      room_tone: -12                     # under every silence, always present
      riser_peak: +6                     # at the top of the riser, into the landing
      impact_peak: +12                   # the low hit on a hard cut at a reveal
      sting_peak: +14                    # the act boundary, under the fade to black
    ambience:
      per_act: true
      palettes: [wind, stone, sea, desert]
      rule: "One ambience per act, chosen for the act's place, not its mood.
             An act that moves between two places keeps the ambience of the
             place the narration is in, and changes on the act boundary."
      loop_crossfade_seconds: 8
    room_tone:
      under_every_silence: true
      rule: "Written air is never digital silence. A gap with nothing under it
             reads as a dropout — the viewer checks whether the audio broke.
             Room tone runs the whole film at its level and is simply what is
             left when the voice stops."
    riser:
      max_seconds: 2.0
      into: landing_line
      rule: "A soft riser, no more than two seconds, ending ON the first word
             of the landing line. It never crosses the line it is leading to."
    impact:
      on: hard_cut_at_reveal
      max_per_act: 2
      rule: "A low impact lands with the picture on the cut into a reveal, not
             after it. At most two per act; three is a trailer."
    sting:
      on: act_boundary
      rule: "One per boundary, under the fade through black, timed to the music
             crossfade at 2.5s. The act card is already silent furniture — the
             sting is what makes the silence deliberate."
    licence:
      sources_in_order: ["freesound CC0", "pixabay content licence"]
      recorded_per_asset: true
      rule: "Every sound carries provider, URL and licence in the sound_design
             artifact, on the same terms as every picture."

  # ── alignment QA (ADDED 2026-10-20, owner rule) ───────────────────────
  # A paragraph the aligner was not sure about is re-synthesised and
  # re-aligned; if it is still under after two attempts the stage fails.
  #
  # Confidence catches what the duration gate cannot. The duration gate finds
  # an alignment that collapsed — run #1 had an eight-word sentence in 30
  # milliseconds. It cannot find one that is confidently placed and wrong, or
  # a synthesis the aligner could barely follow. The collapsed sentence scored
  # 0.08-0.33 against 0.67-0.96 either side, and that signal was there before
  # anyone looked at the timings.
  #
  # MEASURED ON RUN #1 AT 0.5: 23 of 54 paragraphs are under, which is 43% of
  # the film and too many to be a defect rate. The paragraph median is 0.546,
  # so 0.5 sits just below the middle of the distribution rather than in its
  # tail.
  #
  # The obvious explanation — that the aligner loses confidence on proper
  # nouns and spoken numerals, of which this script has many — was measured
  # and does NOT hold: the correlation is -0.087, and the high-density
  # paragraphs average 0.475 against 0.567 for the rest, on a sample of
  # eleven. The likelier reason is that wav2vec2 was trained on human speech
  # and this narration is synthesised, which moves the whole median down
  # rather than creating a tail.
  #
  # The threshold lives here so it can be tuned against that distribution
  # rather than re-synthesising half a film on an uncalibrated number. At 0.35
  # the rule flags five paragraphs, which is the order of magnitude of
  # something actually wrong. See reports/alignment_confidence.md.
  alignment_qa:
    min_mean_confidence: 0.5
    max_attempts: 2
    granularity: paragraph
    # Not configured: the narration is kokoro through the hyperframes CLI,
    # which is outside this repo. With no command the gate names the
    # paragraphs and fails rather than pretending to have fixed them.
    # Placeholders: {text_file} {out_wav} {section_id} {index}
    resynth_command: null
    measured_run_1:
      paragraphs: 54
      under_0_5: 23
      section_means: {cold_open: 0.609, act1: 0.547, act2: 0.454,
                      act3: 0.710, act4: 0.629, outro: 0.787}
      note: >
        See reports/alignment_confidence.md. Act 2 is the lowest section and is
        also the one carrying the most proper nouns and numerals.

  # ── music selection (binding) ──────────────────────────────────────────
  # Run #1 picked beds by mood word and they carried tunes under the
  # narration. The criteria are now stated as properties a track either has
  # or does not, and they are measurable before anyone listens.
  music_selection:
    want: "sparse ambient pads or sustained tones. Elevator-quiet."
    forbidden:
      - melody                      # anything with a tune competes with the voice
      - percussion
      - swells or builds
      - "paulstretch drones with audible texture"
    measure_before_choosing:
      melodic_movement: "frame-to-frame pitch-class distance; a held chord barely moves, a tune does. Prefer < 0.11"
      build_db: "p95 - p25 of the loudness envelope across the track. Prefer < 5 dB"
      rhythmic_periodicity: "autocorrelation peak of the onset envelope, 50-200 BPM. Lower is better"
    note: >
      These rank candidates; they cannot certify "no melody". Always audition
      the shortlist as 20-second previews, EQ'd and levelled as they will sit
      in the mix, before committing.
    sources_in_order:
      - "MUSIC_LIBRARY_DIR, where a track meets the criteria"
      - "Pixabay Music: 'ambient pad', 'drone minimal', 'cinematic ambient quiet'"
    licence_recorded: true

  # ── music placement ───────────────────────────────────────────────────
  bed_strategy: per_act_span_with_boundary_crossfades
  max_beds: 3                        # fewer beds, longer spans, fewer seams
  bed_assignment: "by act; adjacent acts share a bed where possible"
  crossfade_seconds: 2.5             # centred ON the act boundary, under the fade to black

  # ── levels (measure, do not assume) ───────────────────────────────────
  narration_short_term_lufs: -16     # the voice is the show
  narration_true_peak_db: -1.5
  music_under_speech_lufs: -36       # absolute, not a ratio
  music_in_gaps_lufs: -26            # gaps longer than 1.5s
  music_at_act_boundaries_lufs: -22  # under the fade through black
  duck:
    keyed_on: narration
    attack_ms: 150
    release_ms: 900                  # slow enough that it never pumps
    method: >
      An explicit gain envelope computed from the narration's short-term
      loudness, not a threshold compressor. A compressor's duck depth depends
      on how far the signal exceeds the threshold, so it cannot be asked for a
      specific "music sits N dB under the voice" and hold it.
  music_eq:
    high_pass_hz: 120
    low_pass_hz: 7000
    presence_cut: "-4 dB at 3 kHz (Q ~1.4), out of the consonant band"
  target_lufs: -14
  true_peak_db: -1.5
  loudness_range_lu: null            # recorded, never targeted — see below
  loudness_range_note: >
    No LRA target. Narration-led material has little loudness range by nature:
    the voice sits at one level for twenty minutes. Run #2 measured about 4 LU.
    Chasing 6-9 would mean letting the music swell, which the selection
    criteria forbid. Record the measured figure and move on.
  max_lufs_variation_between_acts: 2

# ── captions ────────────────────────────────────────────────────────
# CHANGED 2026-10-20. Run #1 burnt word-level captions into the picture for
# the whole film, so text sat on screen for 99.4% of the runtime at one size
# in one place. That is not a caption style, it is a subtitle track rendered
# into the photograph, and it costs the bottom of every frame permanently to
# serve viewers who could have had a track they can switch off or restyle.
# None of the reference films burn their narration.
captions:
  enabled: true
  delivery: closed_captions          # long-form ships a sidecar, not a burn
  granularity: word_level            # the source timing; the TRACK is phrase-level
  source_preference: ["tts_word_timestamps", "transcription_alignment"]
  alignment_rule: "The script is the authority for spelling; the transcript is the authority for timing."

  srt:
    max_chars_per_line: 42
    max_lines: 2
    min_cue_seconds: 1.2
    max_chars_per_second: 20         # broadcast practice is 15-20
    max_intra_cue_gap_seconds: 1.0   # a cue never spans a pause
    break_on: [sentence, box_overflow, pause]
    builder: lib/captions_srt.py
    rule: "A cue that cannot be read is worse than no cue. A short cue is
           repaired from the silence around it, then by moving the boundary,
           and a cue whose word timings are degenerate is REPORTED rather than
           padded — the fix for that one belongs in the alignment."

  publish:
    method: captions.insert
    language: en
    name: "English"
    draft: false
    rule: "Uploaded at publish as a closed-caption track. The film is not
           re-rendered to change a caption."

  # Available, off by default. A short-form cut-down or a silent-autoplay
  # context may want it; a twenty-minute documentary does not.
  burn_in:
    enabled: false
    mode: layout_aware
    preferred_zone: lower_third
    safe_margin_pct: 8
    max_lines: 2
    background: "rgba(12,12,14,0.55)"
    rules:
      - "Every component declares the regions it occupies. The caption layer
         renders in the largest free zone, preferring the lower third."
      - "While any text-bearing component is on screen the caption layer
         suppresses itself. Two blocks of text competing for one frame is
         worse than a missing line, and the component's text is the one that
         carries meaning."
      - "A caption never overlaps the persistent frame's data strips or the
         source attribution."
    legibility_check: "Check burned captions over the BRIGHTEST frame in the piece, not a mid-grey frame."

  text_bearing_components:
    - text_card
    - stat_card
    - callout
    - comparison
    - hero_title
    - section_title
    - act_title_card
    - title_sequence
    - evidence_card
    - scale_comparison
    - document_reveal
    - timeline
    - schematic
    - outro_cta

asset_generation:
  image_prompt_prefix: "archival documentary frame, desaturated warm neutrals, natural light, visible film grain, period-accurate, "
  image_negative_prompt: "neon, teal and orange grade, lens flare, cgi sheen, question mark graphics, red arrows, modern drone plate, glossy, oversaturated"
  diagram_style: "bone-on-near-black editorial diagram, thin ochre rules, serif labels, generous margins, no 3D"
  consistency_anchors:
    - "Near-black field with warm bone typography"
    - "Ochre accent used only for emphasis or a traced route"
    - "Uniform grade across mixed-era footage so cuts do not announce their source"
    - "Attribution lives in the lower-left zone"

overlays:
  stat_card:
    bg: "#14141A"
    border: "#3A3630"
    radius: 3
    shadow: "0 2px 10px rgba(0,0,0,0.5)"
  key_term:
    bg: "#1F1A12"
    text: "#C08A3E"
    radius: 3
  code_block:
    bg: "#0C0C0E"
    text: "#EDE6D8"
    highlight: "#C08A3E"

# One asset, one appearance. Run #1 put 183 slots on 80 photographs; the
# metrics looked fine because nothing counted how often a picture came back.
asset_reuse:
  rule: "Every asset id appears exactly once in the finished edit"
  two_framings_of_one_parent:
    allowed: true
    min_separation_seconds: 240
    must_differ_in_framing: true
    max_appearances: 2
  no_consecutive_slots_share_a_parent: true
  texture_clips: "once each; author a texture_field configuration when the bank runs out"
  authored_graphics: "no two slots may carry an identical component and props"
  # The three places this rule hid from its own gate, all found by measuring
  # rather than by reading the plan:
  #  - media slots carrying no asset_id passed every rule by having nothing to
  #    check, so the gate now fails on an unidentified media slot;
  #  - the identical-configuration rule keyed on treatment == "graphic", which
  #    skipped every authored texture, since those carry treatment "texture";
  #  - an annotated_still is typed "graphic" but carries a PHOTOGRAPH borrowed
  #    from a neighbouring slot. Both the planner and the gate skipped it, so
  #    the plan reported 97 unique assets while the edit rendered one crop
  #    four times. Count what is on screen, not what the plan calls it.
  never_substitute_blind:
    - "A texture clip has no title and no tags. Keep the clip that was chosen
       by watching it, or author the beat. Swapping one blind drew a green
       valley for 'dark void in masonry, torchlight not reaching the back'."
    - "Subject keyword matching is not picture matching. It offered Stonehenge
       for a Welsh outcrop and for a Scottish coastline, and a stone vessel in
       a museum case for 'empty sea horizon, no vessel in frame'. A candidate
       must share a word with the slot AND the slot must independently be about
       that subject -- validating the asset against the subject the matcher
       itself chose is circular."
    - "A caption written for one photograph is a false statement about a
       different one. When the picture changes, the caption, the annotation
       anchors and the annotated_still type all go with it."

# The music is mixed by lib/mix_audio.py and by nothing else. The props
# builder used to carry its own bed-and-sidechain mix; that mix was rejected
# and the replacement was applied by re-muxing onto a finished render, so the
# props builder never learned about it and the next full re-render put the
# rejected music back. A fix that lives downstream of the stage that rebuilds
# the file is not a fix.
music_authority:
  mixer: "lib/mix_audio.py"
  bed_under_speech_lufs: -36
  beds: "at most 3, assigned by act, crossfaded on the boundary under the fade to black"
  ducking: "explicit gain envelope, attack 150ms / release 900ms -- not sidechaincompress"
  blocking_check: "the delivered film's bed must measure -36 LUFS +/- 1.5 LU"
  why_the_other_checks_missed_it: >
    Integrated loudness of narration-led material is set by the voice. The film
    measured -14.0 LUFS and -1.4 dBTP with a bed 25 dB louder than approved,
    and every loudness check passed. Measure the music on its own or do not
    claim to have checked the music.

quality_rules:
  - "Minimum contrast ratio 4.5:1 for all text against its actual backing frame"
  - "No more than 2 accent colors on screen at once"
  - "One claim per frame"
  - "Cut on meaning, never on a fixed interval"
  - "Stills never exceed 20% of slots and always carry a camera move"
  - "At most 4 distinct transition types in the whole piece"
  - "Every asset carries a provider, a source URL and a licence"
  - "No date, name or figure on screen or in narration without a research-brief claim"
  - "Report measured duration, resolution and loudness — never estimated"
  - "A motion-led promise is never delivered as stills"

chart_palette:
  - "#C08A3E"
  - "#8A8578"
  - "#EDE6D8"
  - "#6B5A3E"

color_rules:
  harmony_type: "analogous"
  contrast_validation: true
  colorblind_safe: true

overrides:
  max_deviation_ratio: 0.15
